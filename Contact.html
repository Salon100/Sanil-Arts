<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanil Arts - Contact</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .contact-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            border-radius: 10px;
        }
        .product-title {
            font-size: 18px;
            margin: 10px 0;
        }
        .product-price {
            color: #e44d26;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .buy-btn, .contact-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #e44d26;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .buy-btn:hover, .contact-btn:hover {
            background: #c63c1f;
        }
        .contact-section {
            margin: 50px auto;
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        .contact-form {
            text-align: left;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .contact-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form button {
            background: #e44d26;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .contact-form button:hover {
            background: #c63c1f;
        }
        .map-container {
            margin: 50px auto;
            text-align: center;
            max-width: 600px;
        }
        .map-container iframe {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #bbb;
            color: #000;

        }
        
             /* Footer Styling */
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
   
    <div class="contact-section">
        <a href="sanilart.html" class="back-btn">&#8592;</a>
        <h2>Contact Us</h2>
        <p>Email: sanilartsnepal1@gmail.com</p>
        <p>Phone: +977-9707753245</p>
        <p>Sitapaila, Kathmandu, Nepal</p>
          </div>

    <div class="contact-form">
        <h2>Send Us a Message</h2>
        <form action="submit_form.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </div>
    <div class="map-container">
        <h2>Find Us Here</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.0079298483863!2d85.3239593!3d27.7172453!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb1914ff1a6e55%3A0x66b44d3912a25f7a!2sKathmandu%2C%20Nepal!5e0!3m2!1sen!2s!4v1711141812345" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    </footer>

</body>
</html>
