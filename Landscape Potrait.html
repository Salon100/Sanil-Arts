<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landscape Potrait</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .image-container {
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .product-image {
            width: auto;
            height: 200px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .product-image:hover {
            transform: scale(1.05);
        }

        .product-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .product-description {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .product-price {
            font-size: 1.8rem;
            color: #2ecc71;
            margin-bottom: 2rem;
            font-weight: bold;
        }

        .buy-now {
            display: inline-block;
            background-color: #fff1ba;
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s;
        }

        .buy-now:hover {
            background-color: #fff1ba;
        }

        .terms {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .shipping-info {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Styling the logo */
        .logo {
            position: absolute;
            top: 10px;   /* Distance from the top of the page */
            left: 70px;  /* Distance from the left of the page */
            width: 60px;  /* Smaller logo size */
            height: auto;
        }

        /*back-btn*/
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #bbb;
            color: #000;
        }

        /* Styling the logo */
        .logo {
            position: absolute;
            top: 10px;   /* Distance from the top of the page */
            left: 70px;  /* Distance from the left of the page */
            width: 60px;  /* Smaller logo size */
            height: auto;
        }

        @media (max-width: 480px) {
            .product-card {
                padding: 1.5rem;
            }
            
            .product-title {
                font-size: 1.5rem;
            }
            
            .product-price {
                font-size: 1.4rem;
            }

            .buy-now {
                font-size: 1rem;
                padding: 0.8rem 1.5rem;
            }
        }

/* Footer Styles */
footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1.5rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 1rem;
        }

        footer a {
            color: yellow;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #f39c12;
        }

    </style>
</head>
<body>
    <img src="SanilArts.png" alt="Sanil Arts Logo" class="logo">
    <a href="Shop.html" class="back-btn">&#8592;</a> 

    <div class="product-card">
        <div class="image-container">
            <img src="zz.jpg" alt="Landscape Potrait Example" class="product-image">
        </div>
        <h1 class="product-title">Landscape Potrait</h1>
        <p class="product-description">Beautiful Landscape in canvas.</p>
        <div class="product-price">Rs 14,999.00/-</div>
        <a href="Buy-btn.html" class="buy-now">Buy Now</a>
        <p class="terms">Terms and Conditions</p>
        <p class="shipping-info">Shipping: 2-3 Business Days</p>
    </div> 

<!-- Footer -->
<footer>
    <p>&copy; 2025 Sanil Arts. | All Rights Reserved. | Follow us on <a href="https://www.instagram.com/sanil_arts_/" style="color: yellow; text-decoration: none;">Instagram</a>, <a href="https://www.facebook.com/profile.php?id=100084654287003" style="color: yellow; text-decoration: none;">Facebook</a></p>
</footer>

</body>
</html>
