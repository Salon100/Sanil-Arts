<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanil Arts - Buy Now</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .payment-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            flex: 1;
        }
        h2 {
            color: #333;
        }
        .payment-methods {
            margin-top: 20px;
        }
        .payment-methods img {
            width: 100px;
            margin: 10px;
        }
        .payment-form {
            text-align: left;
            margin-top: 20px;
        }
        .payment-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .payment-form input, .payment-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            margin-left: -10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .payment-btn {
            background: #e44d26;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        .payment-btn:hover {
            background: #c63c1f;
        }

        /*back-btn*/
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #bbb;
            color: #000;
        }

        /* Styling the logo */
        .logo {
            position: absolute;
            top: 10px;   /* Distance from the top of the page */
            left: 70px;  /* Distance from the left of the page */
            width: 60px;  /* Smaller logo size */
            height: auto;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .payment-container {
                width: 90%;
                margin: 20px auto;
            }
            .back-btn {
                font-size: 25px;
                padding: 8px;
            }
        }
    </style>
    <script>
        function updateAmount() {
            var sizePrices = {
                "7*7cm":600,
                "10*10cm":1200,
                "12*16cm":1800,
                "16*16cm":2100,
                "16*20cm":2600,
                "20*20cm":3000,
                "A4": 1000,
                "A3": 2000,
                "A2": 3000,
                "A1": 4000
            };
            var selectedSize = document.getElementById("canvas-size").value;
            document.getElementById("amount").value = sizePrices[selectedSize] || "";
        }
    </script>
</head>
<body>
    <img src="SanilArts.png" alt="Sanil Arts Logo" class="logo">
    <a href="Shop.html" class="back-btn">&#8592;</a> 

    <div class="payment-container">
        <h2>Complete Your Purchase</h2>
        <p>Select your preferred payment method:</p>
        
        <div class="payment-methods">
            <img src="esewa.png" alt="eSewa">
            <img src="khalti.png" alt="Khalti">
            <img src="bank.png" alt="Bank Transfer">
        </div>
        
        <form class="payment-form" action="process_payment.php" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="Contact no">Contact no:</label>
            <input type="contact no" id="contact no" name="contact no" required>
            
            <label for="email">Email(optional)</label>
            <input type="email" id="email" name="email" required>
            
            <label for="canvas-size">Choose Canvas Size:</label>
            <select id="canvas-size" name="canvas-size" onchange="updateAmount()" required>
                <option value="">Select Size</option>
                <option value="Customize"> Customize </option>
                <option value="7*7cm">7*7cm </option>
                <option value="10*10cm">10*10cm </option>
                <option value="12*16cm">12*16cm </option>
                <option value="16*16cm">16*16cm </option>
                <option value="16*20cm">16*20cm </option>
                <option value="20*20cm">20*20cm </option>
                <option value="A4">A4 </option>
                <option value="A3">A3 </option>
                <option value="A2">A2 </option>
                <option value="A1">A1 </option>
            </select>
            
            <label for="amount">Amount (NPR):</label>
            <input type="number" id="amount" name="amount" readonly required>
            
            <label for="payment-method">Choose Payment Method:</label>
            <select id="payment-method" name="payment-method" required>
                <option value="esewa">eSewa</option>
                <option value="khalti">Khalti</option>
                <option value="bank">Bank Transfer</option>
            </select>
            
            <button type="submit" class="payment-btn">Proceed to Pay</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Sanil Arts. | All Rights Reserved. | Follow us on <a href="https://www.instagram.com/sanil_arts_/" style="color: yellow; text-decoration: none;">Instagram</a>, <a href="https://www.facebook.com/profile.php?id=100084654287003" style="color: yellow; text-decoration: none;">Facebook</a></p>
    </footer> 

</body>
</html>
