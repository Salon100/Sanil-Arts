<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f0f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 2.8rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .application-form {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 1.1rem;
            color: #333;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            background-color: #f5f6fa;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #2ecc71;
            background-color: #e8f6e8;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group .error {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .submit-btn {
            background-color: #f1cf9d;
            color: white;
            padding: 14px 24px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #f1cf9d;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

         /* Footer Styling */
         footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }

        @media (max-width: 480px) {
            .application-form {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .submit-btn {
                font-size: 1rem;
            }
        }

        /*back-btn*/
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #eaeaea;
            color: #000;
        }

    </style>
</head>
<body>

    <a href="Job.html" class="back-btn">&#8592;</a>

    <h1>Job Application Form</h1>

    <div class="application-form">
        <form id="jobApplicationForm" method="POST">
            <!-- Personal Details -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
                <div class="error" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
                <div class="error" id="phoneError"></div>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" required></textarea>
                <div class="error" id="addressError"></div>
            </div>

            <!-- Experience -->
            <div class="form-group">
                <label for="experience">Work Experience (in years)</label>
                <input type="number" id="experience" name="experience" required>
                <div class="error" id="experienceError"></div>
            </div>

            <!-- Resume Upload -->
            <div class="form-group">
                <label for="resume">Upload Resume</label>
                <input type="file" id="resume" name="resume" required>
                <div class="error" id="resumeError"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

    <!-- EmailJS SDK -->
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>

    <script>
        (function() {
            emailjs.init("sanilartsnepal1@gmail.com");  // Replace with your EmailJS user ID
        })();

        document.getElementById("jobApplicationForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let isValid = true;

            // Clear previous error messages
            const errors = document.querySelectorAll('.error');
            errors.forEach(error => error.innerText = '');

            // Form Validation (you can add more validation logic here)
            const fullName = document.getElementById("fullName");
            const email = document.getElementById("email");
            const phone = document.getElementById("phone");
            const address = document.getElementById("address");
            const experience = document.getElementById("experience");
            const resume = document.getElementById("resume");

            if (!fullName.value) {
                document.getElementById("fullNameError").innerText = "Full Name is required.";
                isValid = false;
            }
            if (!email.value) {
                document.getElementById("emailError").innerText = "Email is required.";
                isValid = false;
            }
            if (!phone.value) {
                document.getElementById("phoneError").innerText = "Phone Number is required.";
                isValid = false;
            }
            if (!address.value) {
                document.getElementById("addressError").innerText = "Address is required.";
                isValid = false;
            }
            if (!experience.value) {
                document.getElementById("experienceError").innerText = "Experience is required.";
                isValid = false;
            }
            if (!resume.value) {
                document.getElementById("resumeError").innerText = "Resume is required.";
                isValid = false;
            }

            // If form is valid, submit to EmailJS
            if (isValid) {
                const formData = new FormData(this); // Collect form data
                emailjs.sendForm("service_YOUR_SERVICE_ID", "template_YOUR_TEMPLATE_ID", formData)
                    .then(function(response) {
                        alert("Application Submitted Successfully!");
                    }, function(error) {
                        alert("Error submitting the form. Please try again later.");
                        console.log(error);
                    });
            }
        });
    </script>

<!-- Footer -->
<footer>
    <p>&copy; 2025 Sanil Arts.| All Rights Reserved. | Follow us on <a href="https://www.instagram.com/sanil_arts_/" style="color: yellow; text-decoration: none;">Instagram</a>, <a href="https://www.facebook.com/profile.php?id=100084654287003" style="color: yellow; text-decoration: none;">Facebook</a></p>
</footer>

</body>
</html>
