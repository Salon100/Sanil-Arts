<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanil Arts - Shop</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .shop-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 200px;
            height: auto;
            border-radius: 10px;
        }
        .product-title {
            font-size: 18px;
            margin: 10px 0;
        }
        .product-price {
            color: #e44d26;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .buy-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #e44d26;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .buy-btn:hover {
            background: #c63c1f;
        }

        /*back-btn*/
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #bbb;
            color: #000;
        }
          /* Global reset for body */
          
        .body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styling the logo */
        .logo {
            position: absolute;
            top: 10px;   /* Distance from the top of the page */
            left: 70px;  /* Distance from the left of the page */
            width: 60px;  /* Smaller logo size */
            height: auto;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }

        /* Mobile Responsiveness */
            @media (max-width: 768px) {
            .gallery {
                flex-direction: column;
            }
            .gallery-card {
                width: 100%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="shop-container">
        <img src="SanilArts.png" alt="Sanil Arts Logo" class="logo">
        <a href="index.html" class="back-btn">&#8592;</a>
        <h2>Sanil Arts - Shop</h2>
        <div class="shop-grid">

            <div class="product-card">
                <img src="31.jpg" alt="Art Piece 1">
                <p></p>
                <a href="Acrylic Potraits.html" class="Acrylic Potraits-btn">Acrylic Potraits </a>
            </div>

            <div class="product-card">
                <img src="18.jpg" alt="Art Piece 2">
                <p class="product-price"></p>
                <a href="Costumize Potrait.html" class="Costumize Potrait-btn">Costumize Potrait </a>
            </div>

            <div class="product-card">
                <img src="zz.jpg" alt="Art Piece 3">
                <p class="product-price"></p>
                <a href="Landscape Potrait.html" class="Landscape Potrait-btn">Landscape Potrait </a>
            </div>

        </div>
    </div>

    <!-- Footer -->
     <footer>
        <p>&copy; 2025 Sanil Arts. | All Rights Reserved. | Follow us on <a href="https://www.instagram.com/sanil_arts_/" style="color: yellow; text-decoration: none;">Instagram</a>, <a href="https://www.facebook.com/profile.php?id=100084654287003" style="color: yellow; text-decoration: none;">Facebook</a></p>
    </footer> 

</body>
</html>
