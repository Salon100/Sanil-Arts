<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanil Arts - Gallery</title>
    <link rel="icon" type="x-icon" href="Sanil.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }
        h2 {
            color: #333;
        }
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .gallery-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            width: 300px;
            text-align: center;
            cursor: pointer;
        }
        .gallery-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .gallery-card h3 {
            margin: 10px 0;
            color: #e44d26;
        }
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-size: 30px;
            color: #333;
            padding: 10px;
            background: #ddd;
            border-radius: 50%;
        }
        .back-btn:hover {
            background: #bbb;
            color: #000;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding-top: 60px;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80%;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #999;
            text-decoration: none;
            cursor: pointer;
        }

        /* Logo Styling */
        .logo {
            position: absolute;
            top: 10px;   /* Distance from the top of the page */
            left: 70px;  /* Distance from the left of the page */
            width: 60px;  /* Smaller logo size */
            height: auto;
        }
        /* Footer Styling */
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="SanilArts.png" alt="Sanil Arts Logo" class="logo">
        <a href="index.html" class="back-btn">&#8592;</a>
        
        <h2>Gallery</h2>
        <div class="gallery">
            
            
            <div class="gallery-card">
                <img src="14.jpg" alt="7*7cm" class="thumbnail">
                <h3>7*7cm</h3>
            </div>
            
            <div class="gallery-card">
                <img src="15.jpg" alt="7*7cm" class="thumbnail">
                <h3>7*7cm</h3>
            </div>
            
            <div class="gallery-card">
                <img src="17.jpg" alt="7*7cm" class="thumbnail">
                <h3>7*7cm</h3>
            </div>

            <div class="gallery-card">
                <img src="10.jpg" alt="7*7cm" class="thumbnail">
                <h3>7*7cm</h3>
            </div>
            
            <div class="gallery-card">
                <img src="11.jpg" alt="7*7cm" class="thumbnail">
                <h3>7*7cm</h3>
            </div>
            
            <div class="gallery-card">
                <img src="16.jpg" alt="10*10cm" class="thumbnail">
                <h3>10*10cm</h3>
            </div>
            
            <div class="gallery-card">
                <img src="21.jpg" alt="10*10" class="thumbnail">
                <h3>10*10cm</h3>
            </div>

            <div class="gallery-card">
                <img src="19.jpg" alt="10*10cm" class="thumbnail">
                <h3>10*10cm</h3>
            </div>

            <div class="gallery-card">
                <img src="7.jpg" alt="12*16cm" class="thumbnail">
                <h3>12*16cm</h3>
            </div>

            <div class="gallery-card">
                <img src="8.jpg" alt="12*16cm" class="thumbnail">
                <h3>12*16cm</h3>
            </div>

            <div class="gallery-card">
                <img src="12.jpg" alt="12*16cm" class="thumbnail">
                <h3>12*16cm</h3>
            </div>

            <div class="gallery-card">
                <img src="13.jpg" alt="12*16cm" class="thumbnail">
                <h3>12*16cm</h3>
            </div>

            <div class="gallery-card">
                <img src="20.jpg" alt="12*16cm" class="thumbnail">
                <h3>12*16cm</h3>
            </div>

            <div class="gallery-card">
                <img src="18.jpg" alt="A3" class="thumbnail">
                <h3>A3</h3>
            </div>

            <div class="gallery-card">
                <img src="9.jpg" alt="A2" class="thumbnail">
                <h3>A2</h3>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <span class="close" id="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        // Get the modal, image, and close button
        var modal = document.getElementById("modal");
        var images = document.querySelectorAll(".thumbnail");
        var modalImg = document.getElementById("fullImage");
        var close = document.getElementById("close");

        // When the user clicks on any image, open the modal
        images.forEach(function(image) {
            image.onclick = function() {
                modal.style.display = "block";
                modalImg.src = this.src;
            }
        });

        // When the user clicks on the close button, close the modal
        close.onclick = function() {
            modal.style.display = "none";
        }
    </script>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Sanil Arts. | All Rights Reserved. | Follow us on <a href="https://www.instagram.com/sanil_arts_/" style="color: yellow; text-decoration: none;">Instagram</a>, <a href="https://www.facebook.com/profile.php?id=100084654287003" style="color: yellow; text-decoration: none;">Facebook</a></p>
    </footer>

</body>
</html>
